name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: Build zip (node_modules and skills included, no terminal needed for users)
        run: |
          mkdir -p dist/webai-bridge
          cp -r extension package.json package-lock.json node_modules skills dist/webai-bridge/
          cd dist && zip -qr webai-bridge.zip webai-bridge
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/webai-bridge.zip
          generate_release_notes: true
