<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAI Bridge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.2px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.connected { background: var(--ok); }
    .dot.busy { background: var(--warn); }
    .dot.disconnected { background: var(--err); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: var(--muted);
    }
    .value {
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    label.field-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 8px;
    }
    label.field-label:first-child {
      margin-top: 0;
    }
    input[type="number"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #0f172a;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      min-height: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">WebAI Bridge v2.4</span>
    <span class="badge" id="connectionBadge">
      <span class="dot disconnected" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Active Provider</span>
      <span class="value" id="providerValue">None</span>
    </div>
    <div class="row">
      <span class="label">Upload State</span>
      <span class="value" id="uploadStateValue">IDLE</span>
    </div>
    <div class="row">
      <span class="label">Active Job</span>
      <span class="value" id="jobValue">None</span>
    </div>
  </div>

  <div class="card">
    <label class="field-label" for="portInput">WebSocket Port (1024 - 65535)</label>
    <input type="number" id="portInput" min="1024" max="65535" value="8765" />

    <label class="field-label" for="tokenInput">Session Auth Token (Optional / Per-Session)</label>
    <input type="password" id="tokenInput" placeholder="Paste token from ~/.webai-bridge/session.json" />

    <div class="actions">
      <button type="button" class="primary" id="saveBtn">Save &amp; Reconnect</button>
      <button type="button" class="secondary" id="refreshBtn">Refresh</button>
    </div>
    <div class="status-msg" id="feedbackMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
